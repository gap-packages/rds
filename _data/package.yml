name: RDS
version: "1.10"
license: "GPL-2.0-or-later"
date: 2026-08-02
description: |
    A package for searching relative difference sets

authors:
    - name: Marc Roeder
      url: http://csserver.evansville.edu/~mroeder

maintainers:
    - name: Marc Roeder
      url: http://csserver.evansville.edu/~mroeder
    - name: The GAP Team
      url: mailto:support@gap-system.org

GAP: ">=4.8"

needed-pkgs:
    - name: "DESIGN"
      version: ">=1.3"
      url: "https://gap-packages.github.io/design"
    - name: "SmallGrp"
      version: ">=1.0"
      url: "https://gap-packages.github.io/smallgrp/"

suggested-pkgs:
    - name: "AutPGrp"
      version: ">=1.0"
      url: "https://gap-packages.github.io/autpgrp/"

www: https://gap-packages.github.io/rds/
readme: README.rds
packageinfo: https://gap-packages.github.io/rds/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/gap-packages/rds/releases/download/v1.10/rds-1.10.tar.gz

abstract: |
    This package provides functions for the complete enumeration of relative difference sets.

status: accepted
doc-html: htm/chapters.htm
doc-pdf: doc/manual.pdf
keywords: |
    relative difference sets, finite geometries, projective planes.
